services:
  test:
    build:
      context: .
      target: builder
    command: sh -c "npm run test && npm run test:e2e"
    environment:
      HCM_BASE_URL: "http://localhost:3001"
      DATABASE_PATH: ":memory:"
      NODE_ENV: "test"
      HCM_TIMEOUT_MS: "5000"
      HCM_RETRY_COUNT: "3"
      BALANCE_STALENESS_THRESHOLD_MINUTES: "15"
