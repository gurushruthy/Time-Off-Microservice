services:
  app:
    build:
      context: .
    ports:
      - "3000:3000"
      - "3001:3001"
    environment:
      - HCM_BASE_URL=http://localhost:3001
      - DATABASE_PATH=/data/timeoff.sqlite
      - HCM_TIMEOUT_MS=5000
      - HCM_RETRY_COUNT=3
      - HCM_BATCH_CRON=0 */6 * * *
      - BALANCE_STALENESS_THRESHOLD_MINUTES=15
      - PORT=3000
    volumes:
      - sqlite-data:/data

volumes:
  sqlite-data:
